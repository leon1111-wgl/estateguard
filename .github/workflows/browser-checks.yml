name: Browser checks
# Real-browser regression checks, including the ones that run the in-page models.
# They run here rather than on a developer machine; each check is its own job.
on:
  workflow_dispatch:
  push:
    branches: ['feat/**']
    paths: ['web/**', 'scripts/**', 'data/**', 'docs/validation/**', 'tests/fixtures/**', 'package.json', '.github/workflows/browser-checks.yml']
permissions:
  contents: read
concurrency:
  group: browser-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      checks: ${{ steps.list.outputs.checks }}
    steps:
      - uses: actions/checkout@v6
      - id: list
        run: echo "checks=$(ls scripts/*-check.cjs | xargs -n1 basename | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"
  check:
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # parking-transfer-check pins bit-level encoder parity to the published macOS WebGL run. On this
    # runner the MobileNet calibrated score differs by 1.55e-6 (limit 1e-6) on the commit before the
    # redesign as well (docs/VALIDATION.md); it stays visible as a failed job but does not fail the run.
    continue-on-error: ${{ matrix.check == 'parking-transfer-check.cjs' }}
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(needs.list.outputs.checks) }}
    env:
      ESTATEGUARD_URL: http://127.0.0.1:8766
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-package-lock --no-audit --no-fund
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package.json') }}
      - run: npx playwright install --with-deps chromium
      - name: Serve web/
        run: |
          python3 -m http.server 8766 --bind 127.0.0.1 --directory web > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS -o /dev/null "$ESTATEGUARD_URL/" && exit 0; sleep 1; done; exit 1
      - run: node scripts/${{ matrix.check }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.check }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
