name: Event timeline evaluation (MEVA)
# docs/validation/event-timeline-protocol.md. Video, frames and labels exist only on the runner; the artifacts hold
# detections, counts and metrics. Trigger: push to timeline-run/timing|dev|test, or dispatch after merge.
on:
  push:
    branches: ['timeline-run/**']
  workflow_dispatch:
    inputs:
      split:
        description: 'timing (1 dev clip, detection only), dev (selects the configuration) or test (frozen configuration, once)'
        required: true
        default: timing
        type: choice
        options: [timing, dev, test]
permissions:
  contents: read
concurrency:
  group: timeline-eval-${{ github.ref }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      split: ${{ steps.plan.outputs.split }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v6
      - id: plan
        env:
          INPUT_SPLIT: ${{ inputs.split }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          split="${INPUT_SPLIT:-${REF_NAME#timeline-run/}}"
          case "$split" in timing|dev|test) ;; *) echo "unknown split $split"; exit 1;; esac
          echo "split=$split" >> "$GITHUB_OUTPUT"
          # Pre-registered order and skip rule: missing video or under 20 MB is skipped; take the first N.
          node -e '
            const s=require("./docs/validation/event-timeline-meva-subset.json"),split=process.argv[1];
            const pool=(split==="test"?s.test_candidates:s.dev_candidates).filter(c=>c.bytes&&c.bytes>=20e6);
            const n={timing:1,dev:8,test:16}[split],shards={timing:1,dev:4,test:4}[split],clips=pool.slice(0,n);
            const out=Array.from({length:shards},(_,i)=>({shard:i,clips:clips.filter((_,j)=>j%shards===i).map(c=>({name:c.name,video:c.video}))}));
            require("fs").writeFileSync(process.env.GITHUB_OUTPUT,`shards=${JSON.stringify(out)}\n`,{flag:"a"});
            console.log(JSON.stringify(out,null,1));' "$split"
  detect:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      ESTATEGUARD_URL: http://127.0.0.1:8766
      CLIPS: ${{ toJSON(matrix.clips) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-package-lock --no-audit --no-fund
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package.json') }}
      - run: npx playwright install --with-deps chromium
      - run: command -v ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)
      - name: Serve web/
        run: |
          python3 -m http.server 8766 --bind 127.0.0.1 --directory web > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS -o /dev/null "$ESTATEGUARD_URL/" && exit 0; sleep 1; done; exit 1
      - run: printf '%s' "$CLIPS" > /tmp/clips.json && nproc && free -g
      - run: node scripts/meva-timeline.cjs --clips /tmp/clips.json --out artifacts/timeline-detections --workers 4
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timeline-detections-${{ needs.plan.outputs.split }}-${{ matrix.shard }}
          path: artifacts/timeline-detections/
          if-no-files-found: ignore
          retention-days: 30
  score:
    needs: [plan, detect]
    if: needs.plan.outputs.split != 'timing'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: timeline-detections-${{ needs.plan.outputs.split }}-*
          path: artifacts/timeline-detections
          merge-multiple: true
      - run: node scripts/meva-score.mjs --split ${{ needs.plan.outputs.split }} --detections artifacts/timeline-detections --out artifacts/timeline-eval
      - if: always()
        run: cat artifacts/timeline-eval/summary-*.md >> "$GITHUB_STEP_SUMMARY" || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timeline-eval-${{ needs.plan.outputs.split }}-${{ github.run_id }}
          path: artifacts/timeline-eval/
          if-no-files-found: ignore
          retention-days: 90
