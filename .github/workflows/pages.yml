name: Verify and publish EstateGuard
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: estateguard-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test tests/*.test.mjs
      - run: python3 -m pip install -r requirements-training.txt
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: python3 -m unittest discover -s tests/training -p 'test_*.py'
      - run: python3 scripts/verify_assets.py
      - run: python3 scripts/verify_parking.py
      - run: python3 scripts/audit_parking_errors.py --recompute --output artifacts/parking-error-audit-ci.json
      - run: python3 scripts/make_demo.py
      - run: node scripts/evaluate.mjs data/demo.json data/reference.json --write
      - run: git diff --exit-code -- data web/demo.json web/benchmark.json
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
